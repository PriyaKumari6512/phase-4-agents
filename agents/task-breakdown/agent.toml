# Task Breakdown (PDLC Phase 4, step 4.1): approved stories -> FE / BE / DB / DevOps / QA tasks with estimates and
# dependencies. The engine runs it as structured calls (src/agent_engine/phase4/task_breakdown.py): one per story,
# one cross-story pass; system_prompt.md is the shared, cached instruction for both.
description = "Task Breakdown: splits the approved stories into FE/BE/DB/DevOps/QA tasks with estimates, acceptance criteria and dependencies."
# Mid-tier by default (PDLC tier M); a failed check escalates the fix pass to the frontier model.
model = ["strong", "frontier"]
filesystem = ["ls", "read_file"]
verifier = "task-breakdown/validator"
max_fix_loops = 2
request_history = "agent"

[input]
description = "phase4/stories.json (the approved stories, imported from Jira), prd.md, architecture.md, phase4/project.json (team, Definition of Done, story point scale, repos, deadlines), and the approvals of the design (G3A) and architecture (G3B) gates. Optional: phase4/history.json (resolved tickets, for estimation by analogy)."
files = ["phase4/stories.json", "prd.md", "architecture.md", "phase4/project.json", "gates/G3A.approved.json", "gates/G3B.approved.json"]

[output]
description = "backlog/backlog.json (the approved stories with their tasks: discipline, acceptance criteria, hours, skills, dependencies) and backlog/backlog.md for the Tech Lead's review at P4-G1."
files = ["backlog/backlog.json", "backlog/backlog.md"]
