# Sprint Plan Reviewer: deterministic checks of the plan (capacity, dependencies, releases, goals present).
description = "Sprint Plan Reviewer: deterministic checks of sprint-plan.json against the backlog, capacity and release deadlines."
model = "fast"
filesystem = ["ls", "read_file"]
returns = "verdict"

[input]
description = "The sprint plan, the approved backlog and project settings."
files = ["sprint/sprint-plan.json", "sprint/sprint-plan.md", "backlog/backlog.json", "phase4/project.json"]
