[project]
name = "agent-engine"
version = "0.1.0"
description = "Runs PDLC agents defined as folders (agent.toml + system_prompt.md) on one shared, shell-free harness."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.14",
    "langchain-anthropic>=1.7.2",
    "langchain-openai>=1.6.2",
    "langchain-openrouter>=0.2.0",
    "langfuse>=4.15.3",
    "mammoth>=1.13.0",
    "olefile>=0.47",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    # Phase 4 tools (agents/task-breakdown, sprint-planning, work-allocation, infra-pipeline)
    "httpx>=0.27",
    "jinja2>=3.1",
    "networkx>=3.3",
    "numpy>=2.0",
    "ortools==9.15.6755",
    "pyjwt[crypto]>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# `agent-engine phase4 mine-profiles`: skill and code-ownership evidence from git history
mining = ["pydriller>=2.12"]

[project.scripts]
agent-engine = "agent_engine:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
