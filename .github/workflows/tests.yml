# Runs the test suite on every pull request and on every push to main.
# The tests need no API key and make no model calls.
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python -m pytest -q
      - run: uv build --wheel
      - name: Installed wheel smoke test outside checkout
        run: uv run --python 3.13 --no-project --directory "$RUNNER_TEMP" --with "$GITHUB_WORKSPACE"/dist/agent_engine-*.whl agent-engine list

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f services/allocation-solver/pom.xml test

  policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD/agents/infra-pipeline/knowledge/catalog/policies:/policy:ro" openpolicyagent/conftest:v0.71.0 verify --policy /policy

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/atlantis/Dockerfile -t phase4-atlantis:test .
      - run: docker build -f services/iac-sandbox/Dockerfile -t phase4/iac-sandbox:test services/iac-sandbox
