openapi: 3.0.3
info:
  title: Clinic API v1 - patient appointment management (feature 005)
  version: 1.0.0
  description: >
    Fragment of api-clinic-api-v1 (contracts/clinic-api-v1.openapi.yaml). All paths are under /api.
    Auth: JWT in HttpOnly cookie; writes need the CSRF header. The owner is taken from the session only.
    Times are ISO 8601 with offset; the web app shows them in IST.
servers:
  - url: /api
paths:
  /appointments:
    get:
      operationId: listMyAppointments
      summary: Upcoming and past appointments on the signed-in patient's account (FR-015)
      parameters:
        - name: when
          in: query
          required: false
          schema: { type: string, enum: [upcoming, past, all], default: all }
      responses:
        '200':
          description: List, upcoming soonest first, past most recent first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Appointment' }
        '401': { $ref: '#/components/responses/Unauthorised' }
  /appointments/{appointmentId}:
    get:
      operationId: getMyAppointment
      summary: One appointment of the signed-in account (target of the message link)
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: The appointment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { $ref: '#/components/responses/NotFound' }
  /appointments/{appointmentId}/slots:
    get:
      operationId: listRescheduleSlots
      summary: Free slots for a change - same clinic and treatment, any dentist, inside the booking horizon (FR-016)
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        '200':
          description: Free slots
          content:
            application/json:
              schema:
                type: object
                required: [slots]
                properties:
                  slots:
                    type: array
                    items: { $ref: '#/components/schemas/Slot' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NotChangeable' }
  /appointments/{appointmentId}/cancel:
    post:
      operationId: cancelMyAppointment
      summary: Cancel an upcoming appointment until 4 hours before its start (FR-017, FR-018)
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: Cancelled (also returned for a repeated request)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NotChangeable' }
  /appointments/{appointmentId}/reschedule:
    post:
      operationId: rescheduleMyAppointment
      summary: Move an upcoming appointment to another free slot until 4 hours before its start (FR-016, FR-018)
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dentistId, startsAt]
              properties:
                dentistId: { type: string, format: uuid }
                startsAt: { type: string, format: date-time }
      responses:
        '200':
          description: Rescheduled; the appointment with its new time
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Not changeable (too late, not booked, blocked) or slot taken
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/NotChangeableError'
                  - $ref: '#/components/schemas/SlotTakenError'
        '422':
          description: Invalid body, or slot not offered for this appointment
components:
  parameters:
    AppointmentId:
      name: appointmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorised:
      description: Not signed in
    NotFound:
      description: No such appointment on this account (also for another patient's appointment)
    NotChangeable:
      description: Cannot be changed now
      content:
        application/json:
          schema: { $ref: '#/components/schemas/NotChangeableError' }
  schemas:
    Appointment:
      type: object
      required: [id, personId, personName, clinic, dentistName, treatmentName, startsAt, endsAt, status, canChange, canCancel]
      properties:
        id: { type: string, format: uuid }
        personId: { type: string, format: uuid }
        personName: { type: string }
        clinic:
          type: object
          required: [id, name, phone]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            phone: { type: string, description: Shown instead of the buttons inside 4 hours }
        dentistName: { type: string }
        treatmentName: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        status:
          type: string
          enum: [booked, arrived, no_show, cancelled_by_patient, cancelled_by_clinic]
        canChange: { type: boolean }
        canCancel: { type: boolean }
        changeBlockedReason:
          type: string
          nullable: true
          enum: [too_late, not_booked, blocked, null]
    Slot:
      type: object
      required: [dentistId, dentistName, startsAt, endsAt]
      properties:
        dentistId: { type: string, format: uuid }
        dentistName: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    NotChangeableError:
      type: object
      required: [code, clinicPhone]
      properties:
        code: { type: string, enum: [too_late, not_booked, blocked] }
        clinicPhone: { type: string }
    SlotTakenError:
      type: object
      required: [code, nextSlots]
      properties:
        code: { type: string, enum: [slot_taken] }
        nextSlots:
          type: array
          items: { $ref: '#/components/schemas/Slot' }
