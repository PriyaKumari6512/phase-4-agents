openapi: 3.0.3
info:
  title: BrightSmile Clinic API - reception and dentist day (fragment for feature 006)
  version: 1.0.0
  description: >
    Fragment to be merged into contracts/clinic-api-v1.openapi.yaml (api-clinic-api-v1).
    Auth: JWT in HttpOnly cookie; CSRF header on every write. The receptionist's clinic is taken
    from the staff account, never from the request. Times are ISO 8601 with +05:30 offset in
    responses; stored in UTC.
servers:
  - url: /api
paths:
  /reception/day:
    get:
      summary: Day view of the receptionist's clinic
      description: Role receptionist. One column per dentist working that day (or having an appointment). Cancelled appointments are not listed.
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Day view, content: { application/json: { schema: { $ref: '#/components/schemas/DayView' } } } }
        '400': { description: Invalid date }
        '401': { description: Not signed in }
        '403': { description: Not a receptionist }
  /reception/appointments/{id}:
    get:
      summary: Appointment panel details with allowed actions
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Appointment, content: { application/json: { schema: { $ref: '#/components/schemas/AppointmentPanel' } } } }
        '404': { description: Not found or not of this clinic }
  /reception/appointments/{id}/arrived:
    post:
      summary: Mark arrived
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StatusChange' } } } }
      responses:
        '200': { description: Updated appointment, content: { application/json: { schema: { $ref: '#/components/schemas/AppointmentPanel' } } } }
        '404': { description: Not found or not of this clinic }
        '409': { description: Stored status differs from expected_status, content: { application/json: { schema: { $ref: '#/components/schemas/StatusConflict' } } } }
        '422': { description: Not allowed now (for example not the appointment day) }
  /reception/appointments/{id}/no-show:
    post:
      summary: Mark no-show (from 15 minutes after start until end of that day, IST)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StatusChange' } } } }
      responses:
        '200': { description: Updated appointment, content: { application/json: { schema: { $ref: '#/components/schemas/AppointmentPanel' } } } }
        '404': { description: Not found or not of this clinic }
        '409': { description: Stored status differs from expected_status, content: { application/json: { schema: { $ref: '#/components/schemas/StatusConflict' } } } }
        '422': { description: Too early or too late; body gives allowed_from }
  /reception/appointments/{id}/undo-no-show:
    post:
      summary: Undo a no-show on the same day; status returns to booked
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StatusChange' } } } }
      responses:
        '200': { description: Updated appointment, content: { application/json: { schema: { $ref: '#/components/schemas/AppointmentPanel' } } } }
        '404': { description: Not found or not of this clinic }
        '409': { description: Stored status differs from expected_status, content: { application/json: { schema: { $ref: '#/components/schemas/StatusConflict' } } } }
        '422': { description: Day has ended }
  /reception/appointments/{id}/cancel:
    post:
      summary: Cancel at reception (no 4-hour cut-off)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_status, cancelled_by]
              properties:
                expected_status: { $ref: '#/components/schemas/Status' }
                cancelled_by: { type: string, enum: [patient, clinic] }
      responses:
        '200': { description: Updated appointment, content: { application/json: { schema: { $ref: '#/components/schemas/AppointmentPanel' } } } }
        '404': { description: Not found or not of this clinic }
        '409': { description: Stored status differs from expected_status, content: { application/json: { schema: { $ref: '#/components/schemas/StatusConflict' } } } }
        '422': { description: Not cancellable in this status }
  /reception/appointments/{id}/reschedule:
    post:
      summary: Move to another free slot of the same clinic (any dentist, same treatment)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_status, dentist_id, start_at]
              properties:
                expected_status: { $ref: '#/components/schemas/Status' }
                dentist_id: { type: string, format: uuid }
                start_at: { type: string, format: date-time }
      responses:
        '200': { description: Moved appointment, content: { application/json: { schema: { $ref: '#/components/schemas/AppointmentPanel' } } } }
        '404': { description: Not found or not of this clinic }
        '409': { description: Slot taken (with next free slots) or status changed, content: { application/json: { schema: { $ref: '#/components/schemas/SlotTakenOrConflict' } } } }
        '422': { description: Not movable in this status }
  /reception/appointments:
    post:
      summary: Book for a patient, or book a walk-in
      description: No 4-hour cut-off and no 30-day horizon. When walk_in is true the appointment is created booked and marked arrived in the same transaction.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patient_id, treatment_type_id, dentist_id, start_at]
              properties:
                patient_id: { type: string, format: uuid }
                treatment_type_id: { type: string, format: uuid }
                dentist_id: { type: string, format: uuid }
                start_at: { type: string, format: date-time }
                walk_in: { type: boolean, default: false }
      responses:
        '201': { description: Booked, content: { application/json: { schema: { $ref: '#/components/schemas/AppointmentPanel' } } } }
        '400': { description: Validation error }
        '404': { description: Patient, dentist or treatment not found or dentist not at this clinic }
        '409': { description: Slot taken, with next free slots, content: { application/json: { schema: { $ref: '#/components/schemas/SlotTakenOrConflict' } } } }
  /reception/slots:
    get:
      summary: Free slots of the receptionist's clinic for any active treatment type (reception-only types included)
      parameters:
        - { name: treatment_type_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: dentist_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Free slots, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Slot' } } } } }
  /reception/patients:
    get:
      summary: Find patients by phone number or name (all patients; name and phone only)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 3, maxLength: 64 } }
      responses:
        '200': { description: At most 20 matches, content: { application/json: { schema: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/PatientHit' } } } } }
        '400': { description: Query too short }
    post:
      summary: Create a patient with name and phone number, or return the existing one for that phone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                phone: { type: string }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/PatientHit' } } } }
        '200': { description: Phone already has an account; existing patient returned, content: { application/json: { schema: { $ref: '#/components/schemas/PatientHit' } } } }
        '400': { description: Invalid name or phone }
  /dentist/my-day:
    get:
      summary: The signed-in dentist's own appointments for today at each clinic, read only
      responses:
        '200': { description: Today's appointments grouped by clinic, content: { application/json: { schema: { $ref: '#/components/schemas/MyDay' } } } }
        '403': { description: Not a dentist }
components:
  schemas:
    Status:
      type: string
      enum: [booked, arrived, no-show, cancelled by the patient, cancelled by the clinic]
    StatusChange:
      type: object
      required: [expected_status]
      properties:
        expected_status: { $ref: '#/components/schemas/Status' }
    StatusConflict:
      type: object
      properties:
        current_status: { $ref: '#/components/schemas/Status' }
    Slot:
      type: object
      properties:
        dentist_id: { type: string, format: uuid }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
    SlotTakenOrConflict:
      type: object
      properties:
        code: { type: string, enum: [slot_taken, status_changed] }
        current_status: { $ref: '#/components/schemas/Status' }
        next_free_slots: { type: array, items: { $ref: '#/components/schemas/Slot' } }
    PatientHit:
      type: object
      properties:
        patient_id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
    DayAppointment:
      type: object
      properties:
        id: { type: string, format: uuid }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        patient_name: { type: string }
        phone: { type: string }
        treatment: { type: string }
        status: { $ref: '#/components/schemas/Status' }
        allowed_actions:
          type: array
          items: { type: string, enum: [arrived, no_show, undo_no_show, reschedule, cancel] }
    DayColumn:
      type: object
      properties:
        dentist_id: { type: string, format: uuid }
        dentist_name: { type: string }
        working_hours: { type: array, items: { type: object, properties: { start: { type: string }, end: { type: string } } } }
        appointments: { type: array, items: { $ref: '#/components/schemas/DayAppointment' } }
    DayView:
      type: object
      properties:
        clinic_id: { type: string, format: uuid }
        clinic_name: { type: string }
        date: { type: string, format: date }
        columns: { type: array, items: { $ref: '#/components/schemas/DayColumn' } }
    AppointmentPanel:
      allOf:
        - $ref: '#/components/schemas/DayAppointment'
        - type: object
          properties:
            dentist_id: { type: string, format: uuid }
            dentist_name: { type: string }
            no_show_allowed_from: { type: string, format: date-time }
            history:
              type: array
              items:
                type: object
                properties:
                  from_status: { type: string, nullable: true }
                  to_status: { type: string }
                  at: { type: string, format: date-time }
                  actor_name: { type: string }
    MyDay:
      type: object
      properties:
        date: { type: string, format: date }
        clinics:
          type: array
          items:
            type: object
            properties:
              clinic_id: { type: string, format: uuid }
              clinic_name: { type: string }
              appointments:
                type: array
                items:
                  type: object
                  properties:
                    start_at: { type: string, format: date-time }
                    end_at: { type: string, format: date-time }
                    patient_name: { type: string }
                    treatment: { type: string }
                    status: { $ref: '#/components/schemas/Status' }
