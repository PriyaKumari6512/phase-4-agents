openapi: 3.0.3
info:
  title: BrightSmile Clinic API - scheduling operations (added to api-clinic-api-v1)
  version: 1.0.0
  description: >
    Operations of cmp-scheduling. All paths are under /api, JSON, cookie session, CSRF header on writes.
    Times in requests and responses are ISO 8601; instants are UTC (suffix Z); local-time fields are IST wall clock (HH:MM).
    The screens show IST.
paths:
  /api/clinics:
    get:
      summary: List clinics (all roles; patients see active only)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Clinic' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Add a clinic (practice manager)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClinicInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Clinic' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Name already used by an active clinic }
        '422': { description: Invalid input }
  /api/clinics/{clinicId}:
    patch:
      summary: Edit a clinic or mark it inactive (practice manager)
      parameters: [ { $ref: '#/components/parameters/ClinicId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClinicPatch' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Clinic' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
  /api/dentists:
    get:
      summary: List dentists (all roles; patients see active only)
      parameters:
        - { name: clinicId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Dentist' } } } } }
    post:
      summary: Add a dentist (practice manager)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DentistInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Dentist' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/dentists/{dentistId}:
    patch:
      summary: Edit a dentist or mark inactive (practice manager)
      parameters: [ { $ref: '#/components/parameters/DentistId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DentistPatch' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Dentist' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
  /api/treatment-types:
    get:
      summary: List treatment types (patients see active online types only; reception and manager see all active; manager can ask for inactive too)
      parameters:
        - { name: includeInactive, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TreatmentType' } } } } }
    post:
      summary: Add a treatment type (practice manager)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TreatmentTypeInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TreatmentType' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Duration not a positive multiple of 30 }
  /api/treatment-types/{treatmentTypeId}:
    patch:
      summary: Edit a treatment type or mark inactive (practice manager)
      parameters: [ { name: treatmentTypeId, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TreatmentTypePatch' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TreatmentType' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
  /api/dentists/{dentistId}/clinics/{clinicId}/hours:
    get:
      summary: Read a dentist's weekly hours and breaks at a clinic (manager, reception of that clinic, dentist)
      parameters: [ { $ref: '#/components/parameters/DentistId' }, { $ref: '#/components/parameters/ClinicId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WeeklyHours' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      summary: Replace the whole week at this clinic (practice manager)
      parameters: [ { $ref: '#/components/parameters/DentistId' }, { $ref: '#/components/parameters/ClinicId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WeeklyHours' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/WeeklyHours' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Overlaps the dentist's hours at another clinic }
        '422': { description: Invalid hours or breaks }
  /api/dentists/{dentistId}/leave:
    get:
      summary: List a dentist's leave (practice manager)
      parameters: [ { $ref: '#/components/parameters/DentistId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Leave' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Record leave (practice manager); answers with the appointments to move
      parameters: [ { $ref: '#/components/parameters/DentistId' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LeaveInput' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/LeaveCreated' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: End not after start, or leave already ended }
  /api/leave/{leaveId}:
    delete:
      summary: Delete a leave entry (practice manager)
      parameters: [ { name: leaveId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
  /api/clinics/{clinicId}/to-move:
    get:
      summary: Booked appointments that fall in a dentist's leave at this clinic (reception of this clinic, practice manager)
      parameters: [ { $ref: '#/components/parameters/ClinicId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ToMoveItem' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/clinics/{clinicId}/slots:
    get:
      summary: Free slots for one clinic and one date range
      parameters:
        - { $ref: '#/components/parameters/ClinicId' }
        - { name: treatmentTypeId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, description: First date (IST), schema: { type: string, format: date } }
        - { name: to, in: query, required: true, description: Last date (IST), at most 31 days after from, schema: { type: string, format: date } }
        - { name: dentistId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { slots: { type: array, items: { $ref: '#/components/schemas/Slot' } } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Bad range, or treatment type not allowed for this role }
  /api/clinics/{clinicId}/slots/first-available:
    get:
      summary: Earliest free slots across the clinic's dentists, 10 per page
      parameters:
        - { $ref: '#/components/parameters/ClinicId' }
        - { name: treatmentTypeId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SlotPage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Treatment type not allowed for this role }
components:
  parameters:
    ClinicId: { name: clinicId, in: path, required: true, schema: { type: string, format: uuid } }
    DentistId: { name: dentistId, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Unauthorized: { description: Not signed in }
    Forbidden: { description: Role or clinic not allowed }
  schemas:
    Clinic:
      type: object
      required: [id, name, address, phone, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        address: { type: string }
        phone: { type: string }
        active: { type: boolean }
    ClinicInput:
      type: object
      required: [name, address, phone]
      properties: { name: { type: string }, address: { type: string }, phone: { type: string } }
    ClinicPatch:
      type: object
      properties: { name: { type: string }, address: { type: string }, phone: { type: string }, active: { type: boolean } }
    Dentist:
      type: object
      required: [id, name, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        active: { type: boolean }
        clinicIds: { type: array, items: { type: string, format: uuid }, description: Clinics where the dentist has hours }
    DentistInput:
      type: object
      required: [name]
      properties: { name: { type: string } }
    DentistPatch:
      type: object
      properties: { name: { type: string }, active: { type: boolean } }
    TreatmentType:
      type: object
      required: [id, name, durationMinutes, online, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        durationMinutes: { type: integer, minimum: 30, multipleOf: 30 }
        online: { type: boolean }
        active: { type: boolean }
    TreatmentTypeInput:
      type: object
      required: [name, durationMinutes, online]
      properties: { name: { type: string }, durationMinutes: { type: integer, minimum: 30, multipleOf: 30 }, online: { type: boolean } }
    TreatmentTypePatch:
      type: object
      properties: { name: { type: string }, durationMinutes: { type: integer, minimum: 30, multipleOf: 30 }, online: { type: boolean }, active: { type: boolean } }
    WeeklyHours:
      type: object
      required: [days]
      properties:
        days:
          type: array
          description: At most one entry per weekday; weekdays not listed are days off at this clinic
          items:
            type: object
            required: [weekday, start, end]
            properties:
              weekday: { type: integer, minimum: 0, maximum: 6, description: 0 Monday to 6 Sunday }
              start: { type: string, example: '09:00' }
              end: { type: string, example: '17:00' }
              breaks:
                type: array
                items:
                  type: object
                  required: [start, end]
                  properties: { start: { type: string, example: '13:00' }, end: { type: string, example: '14:00' } }
    Leave:
      type: object
      required: [id, dentistId, startAt, endAt, wholeDay]
      properties:
        id: { type: string, format: uuid }
        dentistId: { type: string, format: uuid }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        wholeDay: { type: boolean }
    LeaveInput:
      type: object
      description: Either whole days (firstDay, lastDay) or a part day (date, startTime, endTime); all in IST
      properties:
        wholeDay: { type: boolean }
        firstDay: { type: string, format: date }
        lastDay: { type: string, format: date }
        date: { type: string, format: date }
        startTime: { type: string, example: '14:00' }
        endTime: { type: string, example: '17:30' }
    LeaveCreated:
      type: object
      required: [leave, toMove]
      properties:
        leave: { $ref: '#/components/schemas/Leave' }
        toMove: { type: array, items: { $ref: '#/components/schemas/ToMoveItem' } }
    ToMoveItem:
      type: object
      required: [appointmentId, clinicId, dentistId, startAt, endAt, treatmentName, patientName, patientPhone]
      properties:
        appointmentId: { type: string, format: uuid }
        clinicId: { type: string, format: uuid }
        dentistId: { type: string, format: uuid }
        dentistName: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        treatmentName: { type: string }
        patientName: { type: string }
        patientPhone: { type: string }
    Slot:
      type: object
      required: [clinicId, dentistId, startAt, endAt]
      properties:
        clinicId: { type: string, format: uuid }
        dentistId: { type: string, format: uuid }
        dentistName: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
    SlotPage:
      type: object
      required: [slots, page, pageSize, hasMore]
      properties:
        slots: { type: array, items: { $ref: '#/components/schemas/Slot' } }
        page: { type: integer }
        pageSize: { type: integer, example: 10 }
        hasMore: { type: boolean }
