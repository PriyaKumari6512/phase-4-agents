openapi: 3.0.3
info:
  title: BrightSmile Clinic API - messaging fragment (feature 007)
  version: 1.0.0
  description: >
    Operations added by feature 007. To be merged into contracts/clinic-api-v1.openapi.yaml.
    Webhook payload schemas are provider specific and are parsed by the channel adapters;
    here the body is an opaque JSON document and the signature is the contract.
paths:
  /api/webhooks/sms:
    post:
      operationId: smsWebhook
      summary: SMS provider delivery receipts and inbound replies (STOP) (rel-009)
      description: >
        No cookie session and no CSRF header. The request is authenticated only by an HMAC signature
        over the raw body with a shared secret. Answers quickly. Unknown message ids and unknown
        phone numbers are ignored (200). Idempotent on the provider message id.
      security:
        - webhookSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Accepted (including ignored events)
        '400':
          description: Body is not valid JSON or has no recognised shape
        '401':
          description: Signature missing or wrong; nothing is processed
        '429':
          description: Rate limited at the edge
  /api/webhooks/whatsapp:
    post:
      operationId: whatsappWebhook
      summary: WhatsApp provider delivery receipts (rel-010)
      security:
        - webhookSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Accepted (including ignored events)
        '400':
          description: Body is not valid JSON or has no recognised shape
        '401':
          description: Signature missing or wrong; nothing is processed
        '429':
          description: Rate limited at the edge
  /api/patient-accounts/{accountId}/reminders:
    put:
      operationId: setRemindersEnabled
      summary: Reception switches reminders off or on in the patient's record (FR-031)
      security:
        - cookieSession: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: Current setting
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
        '403':
          description: Caller is not reception or practice manager
        '404':
          description: Unknown account
  /api/reception/reminders-failed:
    get:
      operationId: listRemindersFailed
      summary: Tomorrow's appointments whose reminder failed (FR-033, Release 2)
      description: >
        Tomorrow is the next calendar day in IST. A receptionist gets only their own clinic;
        the practice manager may pass clinicId, or gets both clinics when it is omitted.
        Hidden behind the Release 2 feature flag (404 when off).
      security:
        - cookieSession: []
      parameters:
        - name: clinicId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List, possibly empty
          content:
            application/json:
              schema:
                type: object
                properties:
                  date:
                    type: string
                    format: date
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReminderFailedItem'
        '403':
          description: Caller is not reception or practice manager
        '404':
          description: Release 2 flag is off
components:
  securitySchemes:
    webhookSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: >
        HMAC-SHA256 of the raw body with the provider's shared secret. The real header name and
        encoding are provider specific and are set in the adapter once the provider is chosen.
    cookieSession:
      type: apiKey
      in: cookie
      name: session
  schemas:
    ReminderFailedItem:
      type: object
      required: [appointmentId, startAt, patientName, patientPhone, dentist, treatment, channel, clinicId]
      properties:
        appointmentId:
          type: string
          format: uuid
        clinicId:
          type: string
          format: uuid
        startAt:
          type: string
          format: date-time
        patientName:
          type: string
        patientPhone:
          type: string
        dentist:
          type: string
        treatment:
          type: string
        channel:
          type: string
          enum: [sms, whatsapp]
