openapi: 3.0.3
info:
  title: BrightSmile Clinic API - patient online booking (extract for feature 004)
  version: 1.0.0
  description: >
    Operations added to api-clinic-api-v1 by feature 004. To be merged into
    contracts/clinic-api-v1.openapi.yaml. All operations need a signed-in patient
    (HttpOnly cookie session, CSRF header on writes). The patient is taken from the
    session, never from the request.
servers:
  - url: /api
paths:
  /booking/options:
    get:
      operationId: getBookingOptions
      summary: Clinics, online treatment types, dentists and the patient's remembered channel
      tags: [booking]
      responses:
        '200':
          description: Options for the booking screens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingOptions'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Blocked'
  /booking/slots:
    get:
      operationId: listBookingSlots
      summary: Free slots for one clinic and one online treatment type
      description: >
        With dentist_id: the free slots of that dentist from `from` to `to` (at most 31 days).
        Without dentist_id (first available): the earliest free slots across the clinic's
        dentists, at most `limit` (default and maximum 10), soonest first.
        Dates are limited to today and the 30 days after.
      tags: [booking]
      parameters:
        - { name: clinic_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: treatment_type_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: dentist_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time }, description: "Start of the window (UTC); default now" }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time }, description: "End of the window (UTC); default end of the day of from" }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 10, default: 10 } }
      responses:
        '200':
          description: Free slots, soonest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Blocked'
        '422':
          $ref: '#/components/responses/Invalid'
  /booking/appointments:
    post:
      operationId: bookAppointment
      summary: Book an online appointment
      tags: [booking]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9-]+$' }
          description: One value per confirm; reuse it only to retry the same confirm.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
      responses:
        '201':
          description: Booked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookedAppointment'
        '200':
          description: Same Idempotency-Key and same body as an earlier booking; the original is returned (header Idempotent-Replay true)
          headers:
            Idempotent-Replay:
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookedAppointment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Blocked'
        '409':
          description: Slot just taken (or no longer free). Next free slots are included.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotTaken'
        '422':
          $ref: '#/components/responses/Invalid'
components:
  schemas:
    Channel:
      type: string
      enum: [sms, whatsapp]
    BookingRequest:
      type: object
      required: [clinic_id, treatment_type_id, dentist_id, start, channel]
      additionalProperties: false
      properties:
        clinic_id: { type: string, format: uuid }
        treatment_type_id: { type: string, format: uuid }
        dentist_id: { type: string, format: uuid, description: "The dentist of the chosen slot (also for first available)" }
        start: { type: string, format: date-time, description: "Slot start, UTC" }
        channel: { $ref: '#/components/schemas/Channel' }
        dentist_choice: { type: string, enum: [named, first_available], default: named, description: "Used only to build the next slots after a conflict" }
    Slot:
      type: object
      required: [clinic_id, dentist_id, dentist_name, start, end]
      properties:
        clinic_id: { type: string, format: uuid }
        dentist_id: { type: string, format: uuid }
        dentist_name: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
    SlotList:
      type: object
      required: [slots, horizon_start, horizon_end]
      properties:
        slots: { type: array, items: { $ref: '#/components/schemas/Slot' } }
        horizon_start: { type: string, format: date-time }
        horizon_end: { type: string, format: date-time }
    ClinicOption:
      type: object
      required: [id, name, phone, dentists]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        dentists:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
    TreatmentOption:
      type: object
      required: [id, name, duration_minutes]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        duration_minutes: { type: integer }
    BookingOptions:
      type: object
      required: [clinics, treatments, preferred_channel, who]
      properties:
        clinics: { type: array, items: { $ref: '#/components/schemas/ClinicOption' } }
        treatments: { type: array, items: { $ref: '#/components/schemas/TreatmentOption' } }
        preferred_channel: { $ref: '#/components/schemas/Channel' }
        who:
          type: array
          description: People the visit can be for; the account holder only until feature 008
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
    BookedAppointment:
      type: object
      required: [id, clinic_id, clinic_name, dentist_id, dentist_name, treatment_name, start, end, status, channel]
      properties:
        id: { type: string, format: uuid }
        clinic_id: { type: string, format: uuid }
        clinic_name: { type: string }
        dentist_id: { type: string, format: uuid }
        dentist_name: { type: string }
        treatment_name: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        status: { type: string, enum: [booked] }
        channel: { $ref: '#/components/schemas/Channel' }
    SlotTaken:
      type: object
      required: [code, message, next_slots]
      properties:
        code: { type: string, enum: [slot_taken] }
        message: { type: string }
        next_slots: { type: array, items: { $ref: '#/components/schemas/Slot' } }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [unauthenticated, online_booking_blocked, not_bookable_online, invalid_request, idempotency_key_reused, outside_booking_window] }
        message: { type: string }
        clinic_phone: { type: string, description: "Present for online_booking_blocked and not_bookable_online" }
  responses:
    Unauthenticated:
      description: Not signed in as a patient
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Blocked:
      description: Online booking is not available for this patient; the clinic phone number is returned
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Invalid:
      description: Invalid input, treatment not bookable online, slot outside the 30-day window or key reused with a different body
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
