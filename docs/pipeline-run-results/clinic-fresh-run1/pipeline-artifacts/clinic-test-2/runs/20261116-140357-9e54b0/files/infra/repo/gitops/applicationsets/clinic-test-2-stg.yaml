apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: clinic-test-2-stg
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/brightsmile/clinic-infra.git
        revision: HEAD
        directories:
          - path: gitops/apps/*/stg
  template:
    metadata:
      name: '{{index .path.segments 2}}-stg'
    spec:
      project: default
      source:
        repoURL: https://github.com/brightsmile/clinic-infra.git
        targetRevision: HEAD
        path: gitops/charts/app
        helm:
          valueFiles:
            - '../../apps/{{index .path.segments 2}}/stg/values.yaml'
      destination:
        server: https://kubernetes.default.svc
        namespace: clinic-test-2-stg
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
