apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: clinic-api-alerts
  namespace: clinic-test-2-dev
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: clinic-api.rules
      rules:
        - alert: ClinicApiPodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace="clinic-test-2-dev", pod=~"clinic-api-.*"}[15m]) > 3
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "clinic-api pods are restarting repeatedly"
        - alert: ClinicApiHighErrorRate
          expr: |
            sum(rate(http_server_request_duration_seconds_count{service_name="clinic-api", http_response_status_code=~"5.."}[5m]))
              / clamp_min(sum(rate(http_server_request_duration_seconds_count{service_name="clinic-api"}[5m])), 1e-9) > 0.01
          for: 10m
          labels: {severity: critical}
          annotations:
            summary: "clinic-api 5xx rate above 1.0%"
        - alert: ClinicApiHighLatencyP95
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{service_name="clinic-api"}[5m]))) > 2.0
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "clinic-api p95 latency above 2.0s"
