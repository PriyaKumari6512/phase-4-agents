# References only: secret VALUES live in AWS Secrets Manager and are created by humans / vault workflows.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clinic-api-env
  namespace: clinic-test-2-prod
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: clinic-api-env
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: /clinic-test-2/prod/clinic-api/DATABASE_URL
    - secretKey: JWT_SIGNING_KEY
      remoteRef:
        key: /clinic-test-2/prod/clinic-api/JWT_SIGNING_KEY
    - secretKey: SMS_PROVIDER_API_KEY
      remoteRef:
        key: /clinic-test-2/prod/clinic-api/SMS_PROVIDER_API_KEY
    - secretKey: SMS_WEBHOOK_HMAC_SECRET
      remoteRef:
        key: /clinic-test-2/prod/clinic-api/SMS_WEBHOOK_HMAC_SECRET
    - secretKey: WHATSAPP_PROVIDER_API_KEY
      remoteRef:
        key: /clinic-test-2/prod/clinic-api/WHATSAPP_PROVIDER_API_KEY
    - secretKey: WHATSAPP_WEBHOOK_HMAC_SECRET
      remoteRef:
        key: /clinic-test-2/prod/clinic-api/WHATSAPP_WEBHOOK_HMAC_SECRET
