# taskflow-web (stg) - values for gitops/charts/app
name: taskflow-web
image:
  repository: "ECR_REGISTRY/clinic-test-2/taskflow-web"
  tag: "0.0.0"   # set when a built image is promoted to this environment
replicas: 1
http: true
port: 8080
healthPath: /healthz
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPU: 70
ingress:
  enabled: true
  host: ""             # TODO public DNS name for stg
  certificateArn: ""   # TODO ACM certificate ARN for HTTPS
envFromSecret: ""
env:
  APP_ENV: "stg"
