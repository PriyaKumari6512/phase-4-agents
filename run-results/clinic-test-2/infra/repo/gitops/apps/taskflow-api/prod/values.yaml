# taskflow-api (prod) - values for gitops/charts/app
name: taskflow-api
image:
  repository: "ECR_REGISTRY/clinic-test-2/taskflow-api"
  tag: "0.0.0"   # set when a built image is promoted to this environment
replicas: 2
http: true
port: 8080
healthPath: /healthz
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPU: 70
envFromSecret: "taskflow-api-env"
env:
  APP_ENV: "prod"
