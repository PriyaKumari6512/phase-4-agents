# taskflow-api (stg) - values for gitops/charts/app
name: taskflow-api
image:
  repository: "ECR_REGISTRY/clinic-test-2/taskflow-api"
  tag: "0.0.0"   # set when a built image is promoted to this environment
replicas: 1
http: true
port: 8080
healthPath: /healthz
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPU: 70
envFromSecret: "taskflow-api-env"
env:
  APP_ENV: "stg"
