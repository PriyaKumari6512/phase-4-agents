apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clinic-test-2-stg-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/acme/taskflow-infra.git
    targetRevision: HEAD
    path: gitops/platform/stg
    directory:
      recurse: true
  destination:
    name: clinic-test-2-stg
    namespace: clinic-test-2-stg
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
