name: ci
# Generated by PDLC Phase 4 for taskflow-api (Python 3.12, FastAPI).
on:
  pull_request: {}
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" || pip install -r requirements.txt
      - run: pytest -q
  image:
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.CI_ROLE_ARN }}
          aws-region: us-east-1
      - name: Build and push image
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "${{ vars.ECR_REGISTRY }}"
          docker build -t "${{ vars.ECR_REGISTRY }}/clinic-test-2/taskflow-api:${{ github.sha }}" .
          docker push "${{ vars.ECR_REGISTRY }}/clinic-test-2/taskflow-api:${{ github.sha }}"
      # Promotion is not generated: a new tag reaches gitops/apps/taskflow-api/<env>/values.yaml through a PR to the
      # infra repo (or Argo CD Image Updater); Argo CD then syncs. Never kubectl apply from CI.
