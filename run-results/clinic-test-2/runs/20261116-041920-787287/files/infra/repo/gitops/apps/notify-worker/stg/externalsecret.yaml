# References only: secret VALUES live in AWS Secrets Manager and are created by humans / vault workflows.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notify-worker-env
  namespace: clinic-test-2-stg
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: notify-worker-env
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: /clinic-test-2/stg/notify-worker/DATABASE_URL
    - secretKey: EMAIL_PROVIDER_API_KEY
      remoteRef:
        key: /clinic-test-2/stg/notify-worker/EMAIL_PROVIDER_API_KEY
