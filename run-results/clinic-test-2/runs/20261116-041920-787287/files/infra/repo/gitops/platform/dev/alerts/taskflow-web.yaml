apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: taskflow-web-alerts
  namespace: clinic-test-2-dev
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: taskflow-web.rules
      rules:
        - alert: TaskflowWebPodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace="clinic-test-2-dev", pod=~"taskflow-web-.*"}[15m]) > 3
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "taskflow-web pods are restarting repeatedly"
        - alert: TaskflowWebHighErrorRate
          expr: |
            sum(rate(http_server_request_duration_seconds_count{service_name="taskflow-web", http_response_status_code=~"5.."}[5m]))
              / clamp_min(sum(rate(http_server_request_duration_seconds_count{service_name="taskflow-web"}[5m])), 1e-9) > 0.01
          for: 10m
          labels: {severity: critical}
          annotations:
            summary: "taskflow-web 5xx rate above 1.0%"
        - alert: TaskflowWebHighLatencyP95
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{service_name="taskflow-web"}[5m]))) > 0.3
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "taskflow-web p95 latency above 0.3s"
