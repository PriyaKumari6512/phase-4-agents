apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: taskflow-api-alerts
  namespace: clinic-test-2-prod
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: taskflow-api.rules
      rules:
        - alert: TaskflowApiPodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace="clinic-test-2-prod", pod=~"taskflow-api-.*"}[15m]) > 3
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "taskflow-api pods are restarting repeatedly"
        - alert: TaskflowApiHighErrorRate
          expr: |
            sum(rate(http_server_request_duration_seconds_count{service_name="taskflow-api", http_response_status_code=~"5.."}[5m]))
              / clamp_min(sum(rate(http_server_request_duration_seconds_count{service_name="taskflow-api"}[5m])), 1e-9) > 0.01
          for: 10m
          labels: {severity: critical}
          annotations:
            summary: "taskflow-api 5xx rate above 1.0%"
        - alert: TaskflowApiHighLatencyP95
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{service_name="taskflow-api"}[5m]))) > 0.3
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "taskflow-api p95 latency above 0.3s"
