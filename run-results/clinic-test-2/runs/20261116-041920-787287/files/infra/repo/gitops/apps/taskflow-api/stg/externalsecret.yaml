# References only: secret VALUES live in AWS Secrets Manager and are created by humans / vault workflows.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: taskflow-api-env
  namespace: clinic-test-2-stg
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: taskflow-api-env
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: /clinic-test-2/stg/taskflow-api/DATABASE_URL
    - secretKey: REDIS_URL
      remoteRef:
        key: /clinic-test-2/stg/taskflow-api/REDIS_URL
