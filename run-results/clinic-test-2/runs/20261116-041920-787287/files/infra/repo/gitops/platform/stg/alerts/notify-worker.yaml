apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: notify-worker-alerts
  namespace: clinic-test-2-stg
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: notify-worker.rules
      rules:
        - alert: NotifyWorkerPodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace="clinic-test-2-stg", pod=~"notify-worker-.*"}[15m]) > 3
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "notify-worker pods are restarting repeatedly"
