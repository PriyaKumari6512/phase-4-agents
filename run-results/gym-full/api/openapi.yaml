      operationId: receiveRazorpayWebhook
      summary: Razorpay payment events (handle_razorpay_event, verify_webhook)
      description: |
        Called by Razorpay, not by the web app. The HMAC signature in X-Razorpay-Signature is checked before any change; a wrong signature gives 401 INVALID_SIGNATURE and changes nothing. The event is stored (by event id) before 200 is returned; a repeated event or payment id does nothing. Amount and order id must match the stored order. Only the order id, payment id and amount are kept.
        Stories: US-013.AC2, US-013.AC4, US-014.AC1, US-014.AC4, US-014.AC5, US-015, US-015.AC1, US-015.AC2, US-015.AC4.
