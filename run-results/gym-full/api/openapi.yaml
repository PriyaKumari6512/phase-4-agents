openapi: 3.0.3
info:
  title: FitZone Gym API
  version: 1.0.0
  description: |
    Contract api-gym-api-v1 of ctr-gym-api (architecture v1). JSON over HTTPS under /api/v1.
    Sessions are a signed JWT in the HttpOnly cookie gym_session. Dates are India dates (YYYY-MM-DD),
    timestamps are RFC 3339 UTC, money is whole paise (integer) with currency INR.
    Release marks (x-release) are MVP, R2 or R3 and follow the LLD interface marks.
servers:
  - url: /api/v1
tags:
  - name: system
  - name: reference
  - name: auth
  - name: onboarding
  - name: staff
  - name: members
  - name: membership
  - name: payments
  - name: checkin
  - name: import
  - name: dashboard
  - name: webhooks
paths:
  /health:
    servers:
      - url: /
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness and readiness check
      description: |
        Used by the load balancer and the deploy smoke test. Unauthenticated.
        Stories: none (operations).
      security: []
      x-release: MVP
      responses:
        '200':
          description: The API and its database connection are working
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/Unavailable'
  /branches:
    get:
      tags: [reference]
      operationId: listBranches
      summary: List the branches (list_branches)
      description: |
        The branch choice at sign-up and trial, and the branch filters of staff screens.
        Stories: US-001, US-001.AC1, US-009.AC1, US-009.AC11.
      security: []
      x-release: MVP
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Active branches
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Branch'
        '422':
          $ref: '#/components/responses/ValidationError'
  /plans:
    get:
      tags: [reference]
      operationId: listPlans
      summary: List active plans (list_plans)
      description: |
        Monthly, quarterly and yearly plans with duration and price. Public so a new member sees prices before signing up.
        Stories: US-011, US-011.AC1, US-011.AC2, US-012.AC1, US-012.AC3.
      security: []
      x-release: MVP
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Active plans in display order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Plan'
        '422':
          $ref: '#/components/responses/ValidationError'
  /plans/{plan_id}:
    patch:
      tags: [reference]
      operationId: updatePlan
      summary: Owner edits a plan (update_plan)
      description: |
        Changes the name, duration or price. Applies to future purchases only; payments already made keep their amount (BR-012). Owner only.
        Stories: US-012, US-012.AC1, US-012.AC2, US-012.AC3, US-012.AC4.
      security:
        - cookieAuth: []
      x-release: R2
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanUpdate'
      responses:
        '200':
          description: The updated plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /plans/{plan_id}/quote:
    get:
      tags: [membership]
      operationId: getPlanQuote
      summary: Start and expiry dates a plan would give the signed-in member (quote_renewal)
      description: |
        Used by the order summary for a new member, by the renewal plan choice (active plan: starts after current expiry, expired plan: starts today) and after a trial. The start date is evaluated again when the payment is confirmed (BR-003).
        Stories: US-011.AC3, US-011.AC4, US-011.AC5, US-022.AC1, US-022.AC7, US-023.AC2, US-026.AC4.
      security:
        - cookieAuth: []
      x-release: MVP
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - name: member_id
          in: query
          required: false
          description: Staff only, to preview a desk payment for a member of their branch; a member always gets their own quote
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenewalQuote'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/member-otps:
    post:
      tags: [auth]
      operationId: requestMemberOtp
      summary: Send a sign-in code by WhatsApp (request_member_otp)
      description: |
        Sends a 6-digit code valid 10 minutes to a registered number. At most 3 sends per number per 10 minutes; a new code cancels the earlier one. A number that is not registered gets NOT_REGISTERED with an offer to join or start a trial; a number shared by imported rows gets SHARED_PHONE (ask at the desk). If WhatsApp does not accept the message the answer is WHATSAPP_UNAVAILABLE and the screen offers asking at the front desk.
        Stories: US-002, US-002.AC1, US-002.AC3, US-002.AC4, US-002.AC6, US-002.AC7, US-003, US-010.AC3.
      security: []
      x-release: MVP
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '202':
          description: Code sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/member-sessions:
    post:
      tags: [auth]
      operationId: signInMember
      summary: Member signs in with the code (sign_in_member)
      description: |
        Checks the code (5 wrong tries, then a 15-minute wait) and sets the session cookie (30 days).
        Stories: US-002, US-002.AC1, US-002.AC2, US-002.AC5, US-003.AC1, US-003.AC2, US-003.AC3, US-003.AC4, US-010.AC3, US-039.AC5.
      security: []
      x-release: MVP
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeConfirm'
      responses:
        '200':
          description: Signed in; the cookie gym_session is set
          headers:
            Set-Cookie:
              description: gym_session, HttpOnly, Secure, SameSite=Strict
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/staff-sessions:
    post:
      tags: [auth]
      operationId: signInStaff
      summary: Staff, manager or owner signs in (sign_in_staff)
      description: |
        Username and password. 10 wrong passwords lock the account for 15 minutes. A deactivated account is refused.
        Stories: US-004, US-004.AC1, US-004.AC2, US-004.AC3, US-051, US-051.AC1, US-051.AC2, US-052, US-052.AC1, US-052.AC2, US-008.AC5.
      security: []
      x-release: MVP
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCredentials'
      responses:
        '200':
          description: Signed in; the cookie gym_session is set (12 hours)
          headers:
            Set-Cookie:
              description: gym_session, HttpOnly, Secure, SameSite=Strict
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/session:
    delete:
      tags: [auth]
      operationId: signOut
      summary: Sign out
      description: |
        Clears the session cookie; the R3 offline copy is cleared by the web app at the same time (thr-013).
        Stories: US-005 (role sessions end cleanly).
      security:
        - cookieAuth: []
      x-release: MVP
      responses:
        '204':
          description: Signed out
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Who is signed in and what scope they have (resolve_scope)
      description: |
        Returns role, branch and member id read from the database, so the web app can show only the menus the role needs.
        Stories: US-005, US-005.AC1, US-005.AC2, US-005.AC3, US-005.AC4, US-007.AC3, US-006.AC3.
      security:
        - cookieAuth: []
      x-release: MVP
      responses:
        '200':
          description: The caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /signups:
    post:
      tags: [onboarding]
      operationId: startSignup
      summary: New member starts sign-up (start_signup)
      description: |
        Name, phone and home branch; sends a code by WhatsApp and creates nothing until the code is confirmed. Only these three fields are accepted, no health data. A number that already has an account gets PHONE_ALREADY_REGISTERED and an offer to sign in.
        Stories: US-009, US-009.AC1, US-009.AC4, US-009.AC11, US-009.AC12, US-010, US-010.AC1, US-010.AC2, US-001.AC3, US-054.AC1.
      security: []
      x-release: MVP
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupStart'
      responses:
        '202':
          description: Code sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /signups/confirm:
    post:
      tags: [onboarding]
      operationId: confirmSignup
      summary: Confirm the code and create the member (confirm_signup)
      description: |
        A correct code creates the member, signs them in and leads to the plan choice. A wrong or expired code creates no member.
        Stories: US-009.AC2, US-009.AC10, US-053, US-053.AC1, US-053.AC2, US-053.AC3, US-053.AC4, US-053.AC5, US-053.AC6, US-003.AC1.
      security: []
      x-release: MVP
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeConfirm'
      responses:
        '201':
          description: Member created and signed in
          headers:
            Set-Cookie:
              description: gym_session, HttpOnly, Secure, SameSite=Strict
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /trials:
    post:
      tags: [onboarding]
      operationId: startTrial
      summary: New person starts a free trial (start_trial)
      description: |
        Name, phone and home branch; sends a code. A number that already had a trial or is a loaded member gets TRIAL_NOT_AVAILABLE with an offer of a plan; a number with an account gets PHONE_ALREADY_REGISTERED and an offer to sign in.
        Stories: US-024, US-024.AC1, US-024.AC4, US-025, US-025.AC1, US-025.AC2, US-025.AC3.
      security: []
      x-release: R2
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupStart'
      responses:
        '202':
          description: Code sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /trials/confirm:
    post:
      tags: [onboarding]
      operationId: confirmTrial
      summary: Confirm the code and start the trial (confirm_trial)
      description: |
        A correct code creates the member and a 7-day trial period (start day counts as day 1), signs them in and returns the QR data through GET /me/qr. No payment is asked.
        Stories: US-024.AC1, US-024.AC2, US-024.AC3, US-026, US-026.AC1, US-026.AC2.
      security: []
      x-release: R2
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeConfirm'
      responses:
        '201':
          description: Trial started and member signed in
          headers:
            Set-Cookie:
              description: gym_session, HttpOnly, Secure, SameSite=Strict
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrialSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /staff-users:
    get:
      tags: [staff]
      operationId: listStaffUsers
      summary: List staff and manager accounts (list_staff_users)
      description: |
        Owner only. Never returns password data.
        Stories: US-008, US-008.AC1, US-052.AC1.
      security:
        - cookieAuth: []
      x-release: MVP
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of staff users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/StaffUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [staff]
      operationId: createStaffUser
      summary: Owner creates a staff or manager account (create_staff_user)
      description: |
        Role front desk or branch manager needs a branch; the account then sees only that branch's data. A taken username creates nothing.
        Stories: US-008, US-008.AC1, US-008.AC2, US-008.AC4, US-008.AC5, US-006.AC1.
      security:
        - cookieAuth: []
      x-release: MVP
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUserCreate'
      responses:
        '201':
          description: The new account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /staff-users/{user_id}:
    patch:
      tags: [staff]
      operationId: setStaffActive
      summary: Owner deactivates or reactivates an account (set_staff_active)
      description: |
        A deactivated account is refused on its next request (BR-018).
        Stories: US-008, US-008.AC3.
      security:
        - cookieAuth: []
      x-release: MVP
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffActiveUpdate'
      responses:
        '200':
          description: The updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /members:
    get:
      tags: [members]
      operationId: listMembers
      summary: List members of a branch (list_members)
      description: |
        Front desk and managers get their own branch only; the owner may pass branch_id or omit it for all branches. A manager passing another branch gets FORBIDDEN_BRANCH. Archived and anonymised members are not listed.
        Stories: US-005.AC3, US-006, US-006.AC1, US-006.AC4, US-001.AC2, US-047.AC3, US-039.AC3.
      security:
        - cookieAuth: []
      x-release: R2
      parameters:
        - name: branch_id
          in: query
          required: false
          description: Owner only
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: false
          description: Part of a name
          schema:
            type: string
            minLength: 2
            maxLength: 80
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of members
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/MemberListItem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /members/needs-attention:
    get:
      tags: [members]
      operationId: listNeedsAttention
      summary: Members with no phone or a shared phone (list_needs_attention)
      description: |
        Own branch for front desk and managers, all or one branch for the owner.
        Stories: US-038, US-038.AC1, US-038.AC2, US-038.AC3, US-038.AC4.
      security:
        - cookieAuth: []
      x-release: R2
      parameters:
        - name: branch_id
          in: query
          required: false
          description: Owner only
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of members with the reason
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/NeedsAttentionItem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /members/reminders-off:
    get:
      tags: [members]
      operationId: listRemindersOff
      summary: Members whose reminders are off (list_reminders_off)
      description: |
        Own branch for front desk and managers, all or one branch for the owner.
        Stories: US-047, US-047.AC1.
      security:
        - cookieAuth: []
      x-release: R3
      parameters:
        - name: branch_id
          in: query
          required: false
          description: Owner only
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of members
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/MemberListItem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /members/{member_id}:
    get:
      tags: [members]
      operationId: getMember
      summary: Get one member (get_member)
      description: |
        A member sees only their own record; front desk and managers see members of their own branch; the owner sees all. Another branch gives FORBIDDEN_BRANCH.
        Stories: US-001.AC2, US-006.AC4, US-005.AC1, US-039.AC3, US-040.AC4.
      security:
        - cookieAuth: []
      x-release: MVP
      parameters:
        - $ref: '#/components/parameters/MemberId'
      responses:
        '200':
          description: The member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [members]
      operationId: updateMember
      summary: Edit name, phone or home branch (update_member)
      description: |
        Front desk and managers for members of their own branch, the owner for all. A phone number used by another member is refused with PHONE_IN_USE and the message names that member by name only. An edit cannot make a number shared.
        Stories: US-039, US-039.AC1, US-039.AC2, US-039.AC3, US-039.AC4, US-039.AC5, US-038.AC4.
      security:
        - cookieAuth: []
      x-release: MVP
      parameters:
        - $ref: '#/components/parameters/MemberId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberUpdate'
      responses:
        '200':
          description: The updated member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
