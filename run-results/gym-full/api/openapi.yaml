      description: |
        Called by WhatsApp. The signature in X-Hub-Signature-256 is checked first. A reply that matches a stop word switches that sender's reminders off (only the sender's own phone is matched). Delivery statuses update the message. Idempotent on the provider event id; the reply text is not stored.
