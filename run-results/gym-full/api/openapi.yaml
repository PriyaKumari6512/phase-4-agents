                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/CheckinListItem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /checkins/snapshot:
    get:
      tags: [checkin]
      operationId: getSnapshot
      summary: Offline snapshot of members for the tablet (get_snapshot)
      description: |
        Members changed since a time, with derived status, expiry date and the SHA-256 of the current QR token (never the token). Refreshed every 5 minutes while online; usable offline while at most 20 minutes old. Staff only, no payments in it. Pages up to 500 rows.
        Stories: US-034, US-034.AC1, US-034.AC2, US-034.AC3, US-035.AC2.
      security:
        - cookieAuth: []
      x-release: R3
      parameters:
        - name: since
          in: query
          required: false
          description: Return only members changed after this time; omit for the full list
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Page'
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
      responses:
        '200':
          description: One page of snapshot rows and the ids removed since
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items, removed_member_ids, generated_at]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/SnapshotMember'
                      removed_member_ids:
                        type: array
                        items:
                          type: string
                          format: uuid
                      generated_at:
                        type: string
                        format: date-time
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /checkins/offline-uploads:
    post:
      tags: [checkin]
      operationId: uploadOfflineCheckins
      summary: Send check-ins made offline (upload_offline_checkins)
      description: |
        Each item carries a client id and its original time; an item whose client id is already stored is counted but not stored again.
        Stories: US-035, US-035.AC1.
      security:
        - cookieAuth: []
      x-release: R3
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    $ref: '#/components/schemas/OfflineCheckin'
      responses:
        '200':
          description: How many items were stored and how many were already stored
          content:
            application/json:
              schema:
                type: object
                required: [stored, already_stored]
                properties:
                  stored:
                    type: integer
                  already_stored:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /import-batches:
    get:
      tags: [import]
      operationId: listImportBatches
      summary: List import batches
      description: |
        Lets the owner and staff find the batch whose report to open. Owner and managers and front desk read the reports (own branch lists only).
        Stories: US-037, US-038.
      security:
        - cookieAuth: []
      x-release: MVP
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of batches, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/ImportBatch'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /import-batches/{batch_id}/report:
    get:
      tags: [import]
      operationId: getImportReport
      summary: Load report (get_import_report)
      description: |
        Counts of rows loaded, rows without a phone number and rows sharing a phone number, and per-branch lists of the members concerned (own branch for front desk and managers, all for the owner).
        Stories: US-036.AC1, US-036.AC2, US-036.AC3, US-037, US-037.AC1, US-037.AC2, US-037.AC3, US-038.
      security:
        - cookieAuth: []
      x-release: MVP
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: The report with one page of member lines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportReport'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /dashboard/active-members:
    get:
      tags: [dashboard]
      operationId: getActiveMembers
      summary: Active members per branch (get_active_members)
      description: |
        Non-archived members with a paid (not trial) period with expiry on or after today, by home branch. A manager gets only their branch; the owner gets all, or one with branch_id. 0 is shown when none.
        Stories: US-048, US-048.AC1, US-048.AC2, US-048.AC3, US-048.AC4, US-007.AC1, US-007.AC2, US-007.AC3, US-006.AC3, US-040.AC3.
      security:
        - cookieAuth: []
      x-release: R2
      parameters:
        - name: branch_id
          in: query
          required: false
          description: Owner only
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Counts per branch
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/BranchCount'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /dashboard/renewals-due:
    get:
      tags: [dashboard]
      operationId: getRenewalsDue
      summary: Renewals due this week (get_renewals_due)
      description: |
        Paid periods whose latest expiry is from today to 6 days ahead, with counts per branch and the list of members and expiry dates. Manager: own branch; owner: all or one.
        Stories: US-049, US-049.AC1, US-049.AC2, US-049.AC3, US-049.AC4, US-049.AC5, US-049.AC6, US-049.AC7.
      security:
        - cookieAuth: []
      x-release: R2
      parameters:
        - name: branch_id
          in: query
          required: false
          description: Owner only
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Counts and one page of the list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items, counts]
                    properties:
                      counts:
                        type: array
                        items:
                          $ref: '#/components/schemas/BranchCount'
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/RenewalDueItem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /dashboard/revenue:
    get:
      tags: [dashboard]
      operationId: getRevenue
      summary: Revenue per month per branch (get_revenue)
      description: |
        Recorded (not failed, not cancelled) online and desk payments in each India calendar month, by the member's home branch. A manager sees only their branch. 0 for a month with no payments. On screen only, there is no export.
        Stories: US-050, US-050.AC1, US-050.AC2, US-050.AC3, US-050.AC4, US-050.AC5, US-015, US-017.AC1.
      security:
        - cookieAuth: []
      x-release: R2
      parameters:
        - name: from_month
          in: query
          required: true
          schema:
            type: string
            pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        - name: to_month
          in: query
          required: true
          schema:
            type: string
            pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        - name: branch_id
          in: query
          required: false
          description: Owner only
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One row per branch and month
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/RevenueRow'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: gym_session
      description: Signed JWT in an HttpOnly, Secure, SameSite=Strict cookie; role and branch are read from the database on every request
    razorpaySignature:
      type: apiKey
      in: header
      name: X-Razorpay-Signature
      description: HMAC-SHA256 of the raw body with RAZORPAY_WEBHOOK_SECRET
    whatsappSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
      description: HMAC-SHA256 of the raw body with WHATSAPP_APP_SECRET
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    PlanId:
      name: plan_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MemberId:
      name: member_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Request id; the server makes one when absent and returns it in the same header
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: A repeated request with the same key returns the first result
      schema:
        type: string
        minLength: 8
        maxLength: 64
  responses:
    BadRequest:
      description: Wrong or expired code (OTP_INVALID, OTP_EXPIRED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: No valid session, wrong credentials or wrong webhook signature (UNAUTHENTICATED, INVALID_CREDENTIALS, INVALID_SIGNATURE)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Role or branch not allowed (FORBIDDEN, FORBIDDEN_BRANCH, ACCOUNT_DEACTIVATED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Record not found (NOT_FOUND, MEMBER_NOT_FOUND, PLAN_NOT_FOUND, NOT_REGISTERED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Rule conflict (PHONE_ALREADY_REGISTERED, TRIAL_NOT_AVAILABLE, SHARED_PHONE, PHONE_IN_USE, USERNAME_TAKEN, PAYMENT_NOT_CANCELLABLE)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Input missing or malformed (VALIDATION_ERROR); the message names the field
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Too many tries or sends (OTP_LOCKED, OTP_RATE_LIMITED, ACCOUNT_LOCKED)
      headers:
        Retry-After:
          description: Seconds to wait
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: A dependency is down (WHATSAPP_UNAVAILABLE, PAYMENT_UNAVAILABLE) or the database is not reachable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [code, message, timestamp, correlation_id]
      properties:
        code:
          type: string
          example: OTP_INVALID
        message:
          type: string
          description: Plain English; never personal data of someone other than the caller (exception PHONE_IN_USE names the other member)
        timestamp:
          type: string
          format: date-time
        correlation_id:
          type: string
          format: uuid
    PageMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
    Branch:
      type: object
      required: [id, name, code]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
    Plan:
      type: object
      required: [id, name, months, price_paise, currency, active]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        months:
          type: integer
        price_paise:
          type: integer
        currency:
          type: string
          enum: [INR]
        active:
          type: boolean
    PlanUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        months:
          type: integer
          minimum: 1
          maximum: 36
        price_paise:
          type: integer
          minimum: 1
    OtpRequest:
      type: object
      required: [phone, purpose]
      properties:
        phone:
          type: string
          pattern: '^\+91[6-9][0-9]{9}$'
        purpose:
          type: string
          enum: [signin]
    Challenge:
      type: object
      required: [challenge_id, expires_at]
      properties:
        challenge_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
    CodeConfirm:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^[0-9]{6}$'
    StaffCredentials:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 40
        password:
          type: string
          format: password
          writeOnly: true
          maxLength: 128
    Session:
      type: object
      required: [user, expires_at]
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'
        expires_at:
          type: string
          format: date-time
    TrialSession:
      allOf:
        - $ref: '#/components/schemas/Session'
        - type: object
          required: [trial_end_date]
          properties:
            trial_end_date:
              type: string
              format: date
    CurrentUser:
      type: object
      required: [id, role, display_name]
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [member, front_desk, branch_manager, owner]
        display_name:
          type: string
        branch_id:
          type: string
          format: uuid
          nullable: true
          description: Home branch for a member, assigned branch for staff and managers, null for the owner
        member_id:
          type: string
          format: uuid
          nullable: true
    SignupStart:
      type: object
      required: [name, phone, branch_id]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        phone:
          type: string
          pattern: '^\+91[6-9][0-9]{9}$'
        branch_id:
          type: string
          format: uuid
    StaffUser:
      type: object
      required: [id, username, display_name, role, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        role:
          type: string
          enum: [front_desk, branch_manager, owner]
        branch_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [active, deactivated]
        created_at:
          type: string
          format: date-time
    StaffUserCreate:
      type: object
      required: [username, display_name, role, initial_password]
      properties:
        username:
          type: string
          pattern: '^[a-z0-9._-]{3,40}$'
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        role:
          type: string
          enum: [front_desk, branch_manager]
        branch_id:
          type: string
          format: uuid
        initial_password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 128
    StaffActiveUpdate:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
    Member:
      type: object
      required: [id, name, home_branch_id, source, status, reminders_enabled, phone_shared, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
          nullable: true
        home_branch_id:
          type: string
          format: uuid
        home_branch_name:
          type: string
          description: Computed from the branch
        source:
          type: string
          enum: [signup, trial, import]
        status:
          type: string
          enum: [active, archived, anonymised]
        reminders_enabled:
          type: boolean
        phone_shared:
          type: boolean
        created_at:
          type: string
          format: date-time
    MemberListItem:
      type: object
      required: [id, name, home_branch_id, membership_status, reminders_enabled]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
          nullable: true
        home_branch_id:
          type: string
          format: uuid
        membership_status:
          type: string
          enum: [active, trial, expired, none]
          description: Derived from the latest period and today (India date)
        expiry_date:
          type: string
          format: date
          nullable: true
        reminders_enabled:
          type: boolean
    NeedsAttentionItem:
      allOf:
        - $ref: '#/components/schemas/MemberListItem'
        - type: object
          required: [reason]
          properties:
            reason:
              type: string
              enum: [no_phone, shared_phone]
    MemberUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        phone:
          type: string
          pattern: '^\+91[6-9][0-9]{9}$'
        home_branch_id:
          type: string
          format: uuid
    MembershipView:
      type: object
      required: [status, days_left]
      properties:
        status:
          type: string
          enum: [active, trial, expired, none]
        plan_name:
          type: string
          nullable: true
        plan_months:
          type: integer
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
        expiry_date:
          type: string
          format: date
          nullable: true
        days_left:
          type: integer
          description: 0 on the expiry date, negative after it
    RenewalQuote:
      type: object
      required: [plan_id, price_paise, start_date, expiry_date]
      properties:
        plan_id:
          type: string
          format: uuid
        price_paise:
          type: integer
        start_date:
          type: string
          format: date
        expiry_date:
          type: string
          format: date
    QrToken:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Signed token text to draw as a QR image
    PaymentOrderCreate:
      type: object
      required: [plan_id]
      properties:
        plan_id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
          description: The branch screen the member is on; defaults to the home branch
    PaymentOrderCreated:
      type: object
      required: [order_id, razorpay_order_id, razorpay_key_id, amount_paise, currency]
      properties:
        order_id:
          type: string
          format: uuid
        razorpay_order_id:
          type: string
        razorpay_key_id:
          type: string
          description: Public key id only
        amount_paise:
          type: integer
        currency:
          type: string
          enum: [INR]
    PaymentOrderStatus:
      type: object
      required: [order_id, status]
      properties:
        order_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [created, paid, failed, abandoned]
        plan_id:
          type: string
          format: uuid
        plan_name:
          type: string
        new_expiry_date:
          type: string
          format: date
          nullable: true
          description: Set when status is paid
        failure_reason:
          type: string
          nullable: true
    DeskPaymentCreate:
      type: object
      required: [member_id, plan_id, method]
      properties:
        member_id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
        method:
          type: string
          enum: [cash, upi]
    DeskPaymentResult:
      type: object
      required: [payment, new_start_date, new_expiry_date]
      properties:
        payment:
          $ref: '#/components/schemas/Payment'
        new_start_date:
          type: string
          format: date
        new_expiry_date:
          type: string
          format: date
    Payment:
      type: object
      required: [id, member_id, plan_id, amount_paise, currency, channel, method, branch_id, status, paid_at]
      properties:
        id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
        plan_name:
          type: string
        amount_paise:
          type: integer
        currency:
          type: string
          enum: [INR]
        channel:
          type: string
          enum: [online, desk]
        method:
          type: string
          enum: [upi, card, cash]
        branch_id:
          type: string
          format: uuid
        razorpay_payment_id:
          type: string
          nullable: true
          description: Razorpay reference for online payments
        status:
          type: string
          enum: [recorded, cancelled]
        cancel_reason:
          type: string
          nullable: true
        paid_at:
          type: string
          format: date-time
    Receipt:
      type: object
      required: [payment_id, member_name, plan_name, amount_paise, currency, paid_at]
      properties:
        payment_id:
          type: string
          format: uuid
        member_name:
          type: string
        plan_name:
          type: string
        amount_paise:
          type: integer
        currency:
          type: string
          enum: [INR]
        paid_at:
          type: string
          format: date-time
        reference:
          type: string
          nullable: true
          description: Razorpay payment id, or the payment id for a desk payment
    WebhookAck:
      type: object
      required: [received]
      properties:
        received:
          type: boolean
    LookupMatch:
      type: object
      required: [member_id, name, membership_status, warning]
      properties:
        member_id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
          nullable: true
        home_branch_name:
          type: string
        plan_name:
          type: string
          nullable: true
        membership_status:
          type: string
          enum: [active, trial, expired, none]
        expiry_date:
          type: string
          format: date
          nullable: true
        warning:
          type: boolean
          description: True when the member is expired or has no plan
    CheckinCreate:
      type: object
      required: [member_id]
      properties:
        member_id:
          type: string
          format: uuid
        enter_anyway:
          type: boolean
          default: false
          description: Staff chose to let an expired or no-plan member in
        client_id:
          type: string
          maxLength: 64
    Checkin:
      type: object
      required: [id, member_id, branch_id, staff_user_id, checked_in_at, result, offline]
      properties:
        id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
        staff_user_id:
          type: string
          format: uuid
        checked_in_at:
          type: string
          format: date-time
        result:
          type: string
          enum: [valid, trial, expired, entered_expired]
        offline:
          type: boolean
        expiry_date:
          type: string
          format: date
          nullable: true
          description: Shown with the expired warning
    CheckinListItem:
      type: object
      required: [id, member_name, branch_id, checked_in_at, staff_username, result]
      properties:
        id:
          type: string
          format: uuid
        member_name:
          type: string
        branch_id:
          type: string
          format: uuid
        checked_in_at:
          type: string
          format: date-time
        staff_username:
          type: string
        result:
          type: string
          enum: [valid, trial, expired, entered_expired]
    OfflineCheckin:
      type: object
      required: [member_id, client_id, checked_in_at, result]
      properties:
        member_id:
          type: string
          format: uuid
        client_id:
          type: string
          maxLength: 64
        checked_in_at:
          type: string
          format: date-time
        result:
          type: string
          enum: [valid, trial, expired, entered_expired]
    SnapshotMember:
      type: object
      required: [member_id, name, membership_status, qr_token_sha256]
      properties:
        member_id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
          nullable: true
        membership_status:
          type: string
          enum: [active, trial, expired, none]
        plan_name:
          type: string
          nullable: true
        expiry_date:
          type: string
          format: date
          nullable: true
        qr_token_sha256:
          type: string
          description: SHA-256 of the current token, hex
    ImportBatch:
      type: object
      required: [id, file_name, rows_total, rows_loaded, rows_without_phone, rows_sharing_phone, completed_at]
      properties:
        id:
          type: string
          format: uuid
        file_name:
          type: string
        rows_total:
          type: integer
        rows_loaded:
          type: integer
        rows_without_phone:
          type: integer
        rows_sharing_phone:
          type: integer
        rows_unmatched_plan:
          type: integer
        completed_at:
          type: string
          format: date-time
    ImportReport:
      allOf:
        - $ref: '#/components/schemas/ImportBatch'
        - type: object
          required: [lines, page, page_size, total]
          properties:
            page:
              type: integer
            page_size:
              type: integer
            total:
              type: integer
            lines:
              type: array
              items:
                $ref: '#/components/schemas/NeedsAttentionItem'
    Reminder:
      type: object
      required: [id, kind, expiry_date, due_date, status, attempts]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [7d, 1d, trial1d]
        expiry_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        status:
          type: string
          enum: [due, sent, skipped, retrying, failed]
        skip_reason:
          type: string
          nullable: true
        attempts:
          type: integer
    BranchCount:
      type: object
      required: [branch_id, branch_name, count]
      properties:
        branch_id:
          type: string
          format: uuid
        branch_name:
          type: string
        count:
          type: integer
    RenewalDueItem:
      type: object
      required: [member_id, name, branch_id, expiry_date]
      properties:
        member_id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
          nullable: true
        branch_id:
          type: string
          format: uuid
        expiry_date:
          type: string
          format: date
    RevenueRow:
      type: object
      required: [branch_id, branch_name, month, amount_paise, currency]
      properties:
        branch_id:
          type: string
          format: uuid
        branch_name:
          type: string
        month:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        amount_paise:
          type: integer
        online_paise:
          type: integer
        desk_paise:
          type: integer
        currency:
          type: string
          enum: [INR]
