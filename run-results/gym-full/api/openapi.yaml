      x-release: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Razorpay event body, parsed for event name, order id, payment id and amount only
              additionalProperties: true
      responses:
        '200':
          description: Stored (also returned for a duplicate)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
