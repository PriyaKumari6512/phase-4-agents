name: ci
# Generated by PDLC Phase 4 for gym-api (Python 3.12, FastAPI).
on:
  pull_request: {}
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" || pip install -r requirements.txt
      - run: pytest -q
  image:
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.CI_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Build and push image
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "${{ vars.ECR_REGISTRY }}"
          docker build -t "${{ vars.ECR_REGISTRY }}/gym-full/gym-api:${{ github.sha }}" .
          docker push "${{ vars.ECR_REGISTRY }}/gym-full/gym-api:${{ github.sha }}"
      - name: Record immutable build metadata
        env:
          IMAGE_REPO: ${{ vars.ECR_REGISTRY }}/gym-full/gym-api
          BUILD_SHA: ${{ github.sha }}
        run: |
          digest=$(aws ecr describe-images --repository-name "gym-full/gym-api" --image-ids imageTag="$BUILD_SHA" --query 'imageDetails[0].imageDigest' --output text)
          python -c 'import json,os,sys; json.dump({"component":"gym-api","digest":sys.argv[1],"sha":os.environ["BUILD_SHA"]},open("image.json","w"))' "$digest"
      - uses: actions/upload-artifact@v4
        with:
          name: image-gym-api
          path: image.json
