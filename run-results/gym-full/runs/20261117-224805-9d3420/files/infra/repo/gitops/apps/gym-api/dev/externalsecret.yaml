# References only: secret VALUES live in AWS Secrets Manager and are created by humans / vault workflows.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gym-api-env
  namespace: gym-full-dev
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: gym-api-env
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: /gym-full/dev/gym-api/DATABASE_URL
    - secretKey: razorpay-api-key
      remoteRef:
        key: /gym-full/dev/gym-api/razorpay-api-key
    - secretKey: razorpay-webhook-secret
      remoteRef:
        key: /gym-full/dev/gym-api/razorpay-webhook-secret
    - secretKey: whatsapp-access-token
      remoteRef:
        key: /gym-full/dev/gym-api/whatsapp-access-token
    - secretKey: whatsapp-webhook-app-secret
      remoteRef:
        key: /gym-full/dev/gym-api/whatsapp-webhook-app-secret
    - secretKey: jwt-signing-key
      remoteRef:
        key: /gym-full/dev/gym-api/jwt-signing-key
    - secretKey: qr-signing-key
      remoteRef:
        key: /gym-full/dev/gym-api/qr-signing-key
    - secretKey: database-credentials
      remoteRef:
        key: /gym-full/dev/gym-api/database-credentials
