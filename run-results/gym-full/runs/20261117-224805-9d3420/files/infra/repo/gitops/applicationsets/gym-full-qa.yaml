apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gym-full-qa
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/acme/gym-infra.git
        revision: HEAD
        directories:
          - path: gitops/apps/*/qa
  template:
    metadata:
      name: '{{index .path.segments 2}}-qa'
    spec:
      project: default
      sources:
        - repoURL: https://github.com/acme/gym-infra.git
          targetRevision: HEAD
          path: gitops/charts/app
          helm:
            valueFiles:
              - '../../apps/{{index .path.segments 2}}/qa/values.yaml'
        - repoURL: https://github.com/acme/gym-infra.git
          targetRevision: HEAD
          path: 'gitops/apps/{{index .path.segments 2}}/qa'
          directory:
            exclude: values.yaml
      destination:
        name: gym-full-qa
        namespace: gym-full-qa
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
