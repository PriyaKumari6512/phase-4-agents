apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gym-full-dev-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/acme/gym-infra.git
    targetRevision: HEAD
    path: gitops/platform/dev
    directory:
      recurse: true
  destination:
    name: gym-full-dev
    namespace: gym-full-dev
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
