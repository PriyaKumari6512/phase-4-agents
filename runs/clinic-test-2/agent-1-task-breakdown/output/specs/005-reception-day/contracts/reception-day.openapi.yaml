openapi: 3.0.3
info:
  title: Clinic API v1 - reception day paths (feature 005, MOD-05)
  version: 1.0.0
  description: >
    Paths added to contracts/clinic-api-v1.openapi.yaml. Auth: JWT in HttpOnly cookie, CSRF header on writes.
    The clinic of a receptionist and the dentist of a dentist come from the server-side access context, never from the request.
    Times are ISO 8601 with offset; days are IST dates.
paths:
  /api/reception/day:
    get:
      summary: Day view of the receptionist's clinic (FR-019)
      parameters:
        - {name: date, in: query, required: false, schema: {type: string, format: date}, description: Default today in IST}
      responses:
        '200': {description: Day view, content: {application/json: {schema: {$ref: '#/components/schemas/DayView'}}}}
        '403': {description: Not a receptionist}
  /api/dentist/my-day:
    get:
      summary: The dentist's own day at each clinic, read only (FR-023)
      parameters:
        - {name: date, in: query, required: false, schema: {type: string, format: date}}
      responses:
        '200': {description: Dentist day, content: {application/json: {schema: {$ref: '#/components/schemas/DentistDay'}}}}
        '403': {description: Not a dentist}
  /api/reception/patients/search:
    get:
      summary: Find patients by phone number or name (FR-020)
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 2, maxLength: 100}}
      responses:
        '200': {description: Up to 20 matches, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/PatientRef'}}}}}
        '422': {description: Query too short}
  /api/reception/patients:
    post:
      summary: Create a patient with name and phone number (FR-020)
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PatientCreate'}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/PatientRef'}}}}
        '200': {description: Phone number already exists, existing patient returned, content: {application/json: {schema: {$ref: '#/components/schemas/PatientRef'}}}}
        '422': {description: Invalid name or phone number}
  /api/reception/slots:
    get:
      summary: Free slots for reception, all active treatment types, no horizon limit (FR-020)
      parameters:
        - {name: dentist_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: treatment_type_id, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: date, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200': {description: Free slots, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Slot'}}}}}
  /api/reception/appointments:
    post:
      summary: Book for a patient, optionally as a walk-in (FR-020, FR-021)
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ReceptionBooking'}}}
      responses:
        '201': {description: Booked, content: {application/json: {schema: {$ref: '#/components/schemas/AppointmentRef'}}}}
        '409': {description: Slot taken, content: {application/json: {schema: {$ref: '#/components/schemas/SlotTaken'}}}}
        '422': {description: Invalid input}
  /api/reception/appointments/{id}/move:
    post:
      summary: Move to another free slot or dentist of the clinic (FR-020)
      parameters: [{$ref: '#/components/parameters/AppointmentId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MoveRequest'}}}
      responses:
        '200': {description: Moved, content: {application/json: {schema: {$ref: '#/components/schemas/AppointmentRef'}}}}
        '404': {description: Not found in this clinic}
        '409': {description: Slot taken or status does not allow a move}
  /api/reception/appointments/{id}/cancel:
    post:
      summary: Cancel; records cancelled by the patient or by the clinic (FR-020, FR-024)
      parameters: [{$ref: '#/components/parameters/AppointmentId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CancelRequest'}}}
      responses:
        '200': {description: Cancelled, content: {application/json: {schema: {$ref: '#/components/schemas/AppointmentRef'}}}}
        '404': {description: Not found in this clinic}
        '409': {description: Status does not allow a cancel}
  /api/reception/appointments/{id}/arrive:
    post:
      summary: Mark arrived (FR-021)
      parameters: [{$ref: '#/components/parameters/AppointmentId'}]
      responses:
        '200': {description: Arrived, content: {application/json: {schema: {$ref: '#/components/schemas/AppointmentRef'}}}}
        '404': {description: Not found in this clinic}
        '409': {description: Status does not allow it, content: {application/json: {schema: {$ref: '#/components/schemas/StatusConflict'}}}}
  /api/reception/appointments/{id}/no-show:
    post:
      summary: Mark no-show from 15 minutes after start until the end of that day (FR-022)
      parameters: [{$ref: '#/components/parameters/AppointmentId'}]
      responses:
        '200': {description: No-show, content: {application/json: {schema: {$ref: '#/components/schemas/AppointmentRef'}}}}
        '404': {description: Not found in this clinic}
        '409': {description: Too early, day ended or status does not allow it, content: {application/json: {schema: {$ref: '#/components/schemas/StatusConflict'}}}}
  /api/reception/appointments/{id}/undo:
    post:
      summary: Undo a no-show (or an arrived) the same day, back to booked (FR-022)
      parameters: [{$ref: '#/components/parameters/AppointmentId'}]
      responses:
        '200': {description: Back to booked, content: {application/json: {schema: {$ref: '#/components/schemas/AppointmentRef'}}}}
        '404': {description: Not found in this clinic}
        '409': {description: Day ended or status does not allow it, content: {application/json: {schema: {$ref: '#/components/schemas/StatusConflict'}}}}
  /api/reception/appointments/{id}/history:
    get:
      summary: Who changed the status and when (FR-024)
      parameters: [{$ref: '#/components/parameters/AppointmentId'}]
      responses:
        '200': {description: History, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/HistoryEntry'}}}}}
        '404': {description: Not found in this clinic}
components:
  parameters:
    AppointmentId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    Status:
      type: string
      enum: [booked, arrived, no_show, cancelled_by_patient, cancelled_by_clinic]
    DayView:
      type: object
      required: [date, clinic_id, columns]
      properties:
        date: {type: string, format: date}
        clinic_id: {type: string, format: uuid}
        columns:
          type: array
          items:
            type: object
            required: [dentist_id, dentist_name, appointments]
            properties:
              dentist_id: {type: string, format: uuid}
              dentist_name: {type: string}
              working_from: {type: string, format: date-time}
              working_to: {type: string, format: date-time}
              appointments:
                type: array
                items: {$ref: '#/components/schemas/DayViewAppointment'}
    DayViewAppointment:
      type: object
      required: [id, start_at, end_at, patient_id, patient_name, patient_phone, treatment_name, status]
      properties:
        id: {type: string, format: uuid}
        start_at: {type: string, format: date-time}
        end_at: {type: string, format: date-time}
        patient_id: {type: string, format: uuid}
        patient_name: {type: string}
        patient_phone: {type: string}
        treatment_name: {type: string}
        status: {$ref: '#/components/schemas/Status'}
    DentistDay:
      type: object
      required: [date, clinics]
      properties:
        date: {type: string, format: date}
        clinics:
          type: array
          items:
            type: object
            required: [clinic_id, clinic_name, appointments]
            properties:
              clinic_id: {type: string, format: uuid}
              clinic_name: {type: string}
              appointments:
                type: array
                items:
                  type: object
                  required: [id, start_at, end_at, patient_name, treatment_name, status]
                  properties:
                    id: {type: string, format: uuid}
                    start_at: {type: string, format: date-time}
                    end_at: {type: string, format: date-time}
                    patient_name: {type: string}
                    treatment_name: {type: string}
                    status: {$ref: '#/components/schemas/Status'}
    PatientRef:
      type: object
      required: [id, name, phone]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        phone: {type: string}
    PatientCreate:
      type: object
      required: [name, phone]
      properties:
        name: {type: string, minLength: 2, maxLength: 100}
        phone: {type: string}
    Slot:
      type: object
      required: [dentist_id, start_at, end_at]
      properties:
        dentist_id: {type: string, format: uuid}
        start_at: {type: string, format: date-time}
        end_at: {type: string, format: date-time}
    ReceptionBooking:
      type: object
      required: [patient_id, dentist_id, treatment_type_id, start_at]
      properties:
        patient_id: {type: string, format: uuid}
        dentist_id: {type: string, format: uuid}
        treatment_type_id: {type: string, format: uuid}
        start_at: {type: string, format: date-time}
        walk_in: {type: boolean, default: false}
    MoveRequest:
      type: object
      required: [dentist_id, start_at]
      properties:
        dentist_id: {type: string, format: uuid}
        start_at: {type: string, format: date-time}
    CancelRequest:
      type: object
      required: [asked_by]
      properties:
        asked_by: {type: string, enum: [patient, clinic]}
    AppointmentRef:
      type: object
      required: [id, status, start_at, end_at, dentist_id]
      properties:
        id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/Status'}
        start_at: {type: string, format: date-time}
        end_at: {type: string, format: date-time}
        dentist_id: {type: string, format: uuid}
    SlotTaken:
      type: object
      required: [detail, next_slots]
      properties:
        detail: {type: string}
        next_slots:
          type: array
          items: {$ref: '#/components/schemas/Slot'}
    StatusConflict:
      type: object
      required: [code, detail, current_status]
      properties:
        code: {type: string, enum: [too_early, day_ended, not_allowed, changed_by_other]}
        detail: {type: string}
        current_status: {$ref: '#/components/schemas/Status'}
        allowed_from: {type: string, format: date-time, description: Set when code is too_early}
    HistoryEntry:
      type: object
      required: [from_status, to_status, actor_name, occurred_at]
      properties:
        from_status: {type: string, nullable: true}
        to_status: {$ref: '#/components/schemas/Status'}
        actor_name: {type: string}
        occurred_at: {type: string, format: date-time}
        reason: {type: string, nullable: true}
