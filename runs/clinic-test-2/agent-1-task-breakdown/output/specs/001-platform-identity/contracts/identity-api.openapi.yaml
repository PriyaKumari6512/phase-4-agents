openapi: 3.0.3
info:
  title: BrightSmile Clinic API - identity and clinics (MOD-01)
  version: 1.0.0
  description: >
    Endpoints of feature 001-platform-identity. They are merged into
    contracts/clinic-api-v1.openapi.yaml (api-clinic-api-v1). All paths are under /api except /health.
    Session is an HttpOnly, Secure, SameSite=Strict cookie named bs_session. All writes need the header
    X-Requested-With: brightsmile and an allowed Origin.
servers:
  - url: /api
paths:
  /health:
    get:
      summary: Health check (served at the root, not under /api)
      security: []
      responses:
        '200':
          description: Service and database are reachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Database not reachable
  /auth/patient/code-requests:
    post:
      summary: Ask for a sign-in code by SMS (FR-002)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: "+91 98765 43210" }
      responses:
        '202':
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  expires_in_seconds: { type: integer, example: 600 }
        '422': { $ref: '#/components/responses/ValidationError' }
        '423':
          description: Phone locked after 5 wrong tries (error code PHONE_LOCKED, retry_after_seconds)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Per-IP or daily limit reached (error code TOO_MANY_CODES), no SMS sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: SMS could not be sent (error code SMS_FAILED); does not count as a wrong try
  /auth/patient/code-verifications:
    post:
      summary: Verify the code; signs in or asks for the name of a new patient
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: >
            status=signed_in sets the session cookie; status=name_required means the code is right but no
            account exists, call /auth/patient/registration within 10 minutes
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [signed_in, name_required] }
                  me: { $ref: '#/components/schemas/Me' }
        '400':
          description: Error codes CODE_WRONG (tries_left) or CODE_EXPIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '423':
          description: Locked for 15 minutes (PHONE_LOCKED, retry_after_seconds)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/patient/registration:
    post:
      summary: Create the account of a new phone number after its code was verified (FR-002)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, name]
              properties:
                phone: { type: string }
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '201':
          description: Account created and signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { description: Code not verified or verification older than 10 minutes (VERIFICATION_REQUIRED) }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/staff/sign-in:
    post:
      summary: Staff sign in with username and password (FR-003)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Signed in; cookie set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { description: Username or password wrong (same message for both; INVALID_CREDENTIALS) }
        '423':
          description: Account locked for 15 minutes (ACCOUNT_LOCKED, retry_after_seconds)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/staff/password:
    put:
      summary: Staff change their own password (at least 10 characters)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 10 }
      responses:
        '204': { description: Changed; other sessions of this account ended }
        '400': { description: Current password wrong }
        '401': { $ref: '#/components/responses/NotSignedIn' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/sign-out:
    post:
      summary: End the current session (any role)
      responses:
        '204': { description: Session ended; cookie cleared }
  /me:
    get:
      summary: Who is signed in, role, clinics (read from the database on every call)
      responses:
        '200':
          description: The signed-in person
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/NotSignedIn' }
  /patients:
    get:
      summary: Search patients by phone number or name (receptionist and manager, all clinics; ASM-011)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 3 } }
      responses:
        '200':
          description: Matching patients (no appointments here; appointments are clinic-scoped by their own module)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PatientSummary' }
        '401': { $ref: '#/components/responses/NotSignedIn' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /clinics:
    get:
      summary: Clinics the caller may see (patient: active clinics; receptionist: own; dentist: own clinics; manager: all)
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Clinic' }
        '401': { $ref: '#/components/responses/NotSignedIn' }
    post:
      summary: Manager adds a clinic (FR-001)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClinicInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Clinic' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Name already used (CLINIC_NAME_TAKEN) }
        '422': { $ref: '#/components/responses/ValidationError' }
  /clinics/{clinic_id}:
    patch:
      summary: Manager edits or deactivates a clinic
      parameters:
        - { name: clinic_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClinicPatch' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Clinic' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /dentists:
    get:
      summary: Dentists with their clinic days (receptionist: those working at own clinic; dentist: self; manager: all; patient: active dentists)
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Dentist' }
        '401': { $ref: '#/components/responses/NotSignedIn' }
    post:
      summary: Manager adds a dentist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dentist' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /dentists/{dentist_id}:
    patch:
      summary: Manager renames or deactivates a dentist
      parameters:
        - { name: dentist_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                active: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dentist' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /dentists/{dentist_id}/clinic-days:
    put:
      summary: Manager sets the weekdays a dentist works at each clinic (replaces the list)
      parameters:
        - { name: dentist_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/ClinicDay' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dentist' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Same weekday at two clinics (DENTIST_DOUBLE_DAY) }
  /staff-accounts:
    get:
      summary: Manager lists staff accounts
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StaffAccount' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Manager creates a receptionist or dentist account (FR-005)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffAccountInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAccount' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Username taken (USERNAME_TAKEN) }
        '422': { $ref: '#/components/responses/ValidationError' }
  /staff-accounts/{account_id}:
    patch:
      summary: Manager edits name or clinic, activates or deactivates (a deactivated person cannot sign in)
      parameters:
        - { name: account_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                clinic_id: { type: string, format: uuid }
                active: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAccount' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Last active manager cannot be deactivated (LAST_MANAGER) }
  /staff-accounts/{account_id}/password-reset:
    post:
      summary: Manager sets a new temporary password (at least 10 characters); clears the lock
      parameters:
        - { name: account_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [temporary_password]
              properties:
                temporary_password: { type: string, minLength: 10 }
      responses:
        '204': { description: Reset; sessions of that person ended }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /erasure-requests:
    get:
      summary: Manager lists erasure requests with due date and overdue flag (NFR-007)
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ErasureRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Manager records a request for the patient with this phone number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string }
      responses:
        '201':
          description: Recorded; due in 30 days
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErasureRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No account for this phone (ACCOUNT_NOT_FOUND) }
  /erasure-requests/{request_id}/execution:
    post:
      summary: Manager carries out the erasure (anonymises person, account, sessions, messages)
      parameters:
        - { name: request_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErasureRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Already done (ALREADY_DONE) }
components:
  responses:
    NotSignedIn:
      description: Not signed in (NOT_SIGNED_IN)
    Forbidden:
      description: Role or clinic not allowed (FORBIDDEN)
    NotFound:
      description: Not found, or outside the caller's scope (a receptionist asking for another clinic gets this or 403, never data)
    ValidationError:
      description: Input rejected (field errors)
  schemas:
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string, description: Plain English text for the screen }
        retry_after_seconds: { type: integer }
        tries_left: { type: integer }
    Health:
      type: object
      properties:
        status: { type: string, enum: [ok] }
        database: { type: string, enum: [ok] }
        version: { type: string }
    Me:
      type: object
      properties:
        kind: { type: string, enum: [patient, staff] }
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [patient, receptionist, dentist, manager] }
        clinic_ids: { type: array, items: { type: string, format: uuid } }
        must_change_password: { type: boolean }
    PatientSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
    ClinicInput:
      type: object
      required: [name, address, phone]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        address: { type: string, minLength: 1, maxLength: 300 }
        phone: { type: string, minLength: 5, maxLength: 20 }
    ClinicPatch:
      type: object
      properties:
        name: { type: string }
        address: { type: string }
        phone: { type: string }
        active: { type: boolean }
    Clinic:
      allOf:
        - $ref: '#/components/schemas/ClinicInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            active: { type: boolean }
            assigned_receptionists: { type: integer, description: Receptionists assigned to this clinic (manager only; warns when deactivating) }
    ClinicDay:
      type: object
      required: [clinic_id, weekday]
      properties:
        clinic_id: { type: string, format: uuid }
        weekday: { type: integer, minimum: 0, maximum: 6, description: 0 is Monday }
    Dentist:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        active: { type: boolean }
        clinic_days:
          type: array
          items: { $ref: '#/components/schemas/ClinicDay' }
    StaffAccountInput:
      type: object
      required: [username, name, role, password]
      properties:
        username: { type: string }
        name: { type: string }
        role: { type: string, enum: [receptionist, dentist] }
        clinic_id: { type: string, format: uuid, description: Required for receptionist }
        dentist_id: { type: string, format: uuid, description: Required for dentist }
        password: { type: string, minLength: 10, description: Temporary; must be changed at first sign-in }
    StaffAccount:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        name: { type: string }
        role: { type: string, enum: [receptionist, dentist, manager] }
        clinic_id: { type: string, format: uuid, nullable: true }
        dentist_id: { type: string, format: uuid, nullable: true }
        active: { type: boolean }
        locked_until: { type: string, format: date-time, nullable: true }
    ErasureRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        patient_account_id: { type: string, format: uuid }
        requested_at: { type: string, format: date-time }
        due_at: { type: string, format: date-time }
        done_at: { type: string, format: date-time, nullable: true }
        overdue: { type: boolean }
security:
  - sessionCookie: []
