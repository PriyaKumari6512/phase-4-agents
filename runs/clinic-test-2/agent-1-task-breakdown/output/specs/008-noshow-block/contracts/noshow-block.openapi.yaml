openapi: 3.0.3
info:
  title: Repeat no-show block - additions to api-clinic-api-v1
  version: 1.0.0
  description: >
    Additions for feature 008 (FR-025, FR-026). To be merged into
    contracts/clinic-api-v1.openapi.yaml. All operations are under /api, cookie session, CSRF header on writes.
paths:
  /api/booking-eligibility:
    get:
      summary: Can this person book or reschedule online at this clinic (patient role, own account only)
      parameters:
        - {name: patient_id, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: clinic_id, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Eligibility
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Eligibility'}
        '403': {description: Person is not in the caller's account}
  /api/reception/patients/{patient_id}/no-show-block:
    get:
      summary: Block state of one person (receptionist)
      parameters:
        - {name: patient_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Block state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BlockState'}
        '403': {description: Not a receptionist}
        '404': {description: Unknown person}
  /api/reception/patients/{patient_id}/no-show-block/lift:
    post:
      summary: Lift the current block; the count restarts from zero (receptionist)
      parameters:
        - {name: patient_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Lifted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BlockState'}
        '403': {description: Not a receptionist}
        '404': {description: Unknown person}
        '409': {description: Person is not currently blocked}
components:
  schemas:
    Eligibility:
      type: object
      required: [blocked]
      properties:
        blocked: {type: boolean}
        clinic_phone: {type: string, nullable: true, description: Present when blocked}
    BlockState:
      type: object
      required: [blocked]
      properties:
        blocked: {type: boolean}
        blocked_at: {type: string, format: date-time, nullable: true}
        counted_no_show_dates:
          type: array
          items: {type: string, format: date}
    BlockedError:
      type: object
      description: >
        Body of HTTP 403 returned by the existing online book and online reschedule operations (including the final
        confirm) when the person is blocked.
      required: [code]
      properties:
        code: {type: string, enum: [ONLINE_BOOKING_BLOCKED]}
        clinic_phone: {type: string}
    PatientBlockedFlag:
      type: object
      description: >
        Field added to the existing reception day-view appointment items and patient-search results.
      properties:
        no_show_blocked: {type: boolean}
