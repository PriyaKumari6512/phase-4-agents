openapi: 3.0.3
info:
  title: No-show report (addition to clinic-api-v1)
  version: 1.0.0
  description: >
    One read-only operation for FR-032. To be merged into contracts/clinic-api-v1.openapi.yaml
    in repo brightsmile/clinic-api.
paths:
  /api/reports/no-shows:
    get:
      operationId: getNoShowReport
      summary: No-shows and no-show rate per clinic for the last 12 months (IST)
      description: >
        Practice manager only. Returns 404 while the Release 2 feature flag is off.
        Rate = no-shows / appointments that were not cancelled (cancelled by the patient and
        cancelled by the clinic are both excluded). Walk-ins count like other appointments.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoShowReport'
        '401':
          description: Not signed in
        '403':
          description: Signed in but not the practice manager
        '404':
          description: Feature flag is off
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
  schemas:
    NoShowReport:
      type: object
      required: [generated_at, clinics]
      properties:
        generated_at:
          type: string
          format: date-time
        clinics:
          type: array
          items:
            $ref: '#/components/schemas/ClinicNoShowReport'
    ClinicNoShowReport:
      type: object
      required: [clinic_id, clinic_name, months]
      properties:
        clinic_id:
          type: string
        clinic_name:
          type: string
        months:
          type: array
          minItems: 12
          maxItems: 12
          description: Newest month first
          items:
            $ref: '#/components/schemas/MonthlyNoShow'
    MonthlyNoShow:
      type: object
      required: [month, no_shows, non_cancelled, rate, partial]
      properties:
        month:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
          description: IST month
        no_shows:
          type: integer
          minimum: 0
        non_cancelled:
          type: integer
          minimum: 0
          description: Appointments that were booked, arrived or no-show
        rate:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          description: Percent with one decimal; null when non_cancelled is 0
        partial:
          type: boolean
          description: True for the current month, which is not finished
